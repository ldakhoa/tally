<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track your income, spending, monthly budgets, and savings goals.">
  <meta name="theme-color" content="#142c25">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <title>Tally · Personal budget</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#overview" aria-label="Tally overview">
        <span class="brand-icon" data-icon="logo"></span>
        <span>Tally<span class="brand-period">.</span><small>PERSONAL BUDGET</small></span>
      </a>
      <nav class="navigation" aria-label="Main navigation">
        <p class="nav-label">WORKSPACE</p>
        <a href="#overview" data-page="overview"><span data-icon="grid"></span>Overview</a>
        <a href="#transactions" data-page="transactions"><span data-icon="transactions"></span>Transactions</a>
        <a href="#budgets" data-page="budgets"><span data-icon="pie"></span>Budgets</a>
        <a href="#savings" data-page="savings"><span data-icon="target"></span>Savings goals</a>
        <div class="nav-divider"></div>
        <a href="#settings" data-page="settings"><span data-icon="settings"></span>Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#settings" class="workspace">
          <span class="workspace-icon" data-icon="wallet"></span>
          <span>Personal budget<small id="workspace-currency">SGD · Singapore Dollar</small></span>
          <span class="workspace-chevron" data-icon="chevron-right"></span>
        </a>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <span data-icon="wallet"></span><span class="breadcrumb-label">Workspace</span>
          <span data-icon="chevron-right"></span><span id="current-page">Overview</span>
        </div>
        <div id="data-mode" class="data-mode"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form"></form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
